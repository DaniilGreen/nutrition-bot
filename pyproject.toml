[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "burnfat"
version = "0.1.0"
description = "Telegram-бот учёта питания с AI-разбором сообщений (модель: LLM наполняет, БД фиксирует)"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "openai>=1.50",
    # Второй провайдер (D-41). Пин точный: самый свежий релиз старше двух недель — 2.x вышел
    # за неделю до задачи, две мажорные версии за октябрь 2026. Обновлять руками и с тестами:
    # `test_claude_adapters` гоняет настоящий SDK поверх подменённого транспорта.
    "anthropic==1.14.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # Приезжает транзитивно через openai, но тесты API опираются на него явно:
    # сменят там клиента — и e2e молча перестанут собираться.
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Курируемый каталог — широкая дата-таблица, длинные строки на запись естественны.
"app/infrastructure/products/seed.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
