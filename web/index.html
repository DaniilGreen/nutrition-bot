<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Дневник КБЖУ</title>
<!-- Обязан грузиться с telegram.org: локальная копия протухает молча. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/app.css">
</head>
<body>
  <header>
    <h1 id="title">Сегодня</h1>
    <span id="nav-day">
      <button class="iconbtn" id="back" aria-label="Предыдущий день">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="iconbtn" id="fwd" aria-label="Следующий день" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 18l6-6-6-6"/></svg>
      </button>
    </span>
  </header>

  <main id="screen"><div class="card state">Загружаю…</div></main>

  <nav id="tabs" aria-label="Разделы">
    <button data-tab="day" aria-current="page">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="18" rx="3"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>
      День
    </button>
    <button data-tab="cat">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 6h16M4 12h16M4 18h10"/></svg>
      Продукты
    </button>
    <button data-tab="tot">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      Итоги
    </button>
    <button data-tab="ai">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3l1.9 4.8L19 9.7l-4.2 3 .7 5.3-3.5-2.6L8.5 18l.7-5.3-4.2-3 5.1-1.9z"/></svg>
      AI
    </button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
