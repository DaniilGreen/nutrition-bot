services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-burnfat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-burnfat}
      POSTGRES_DB: ${POSTGRES_DB:-burnfat}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-burnfat}"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    restart: unless-stopped  # авто-подъём после рестарта Docker/сна Мака (не мешает ручному stop)
    # Прогоняем миграции и стартуем бота. Для 2 пользователей один инстанс — ок.
    command: sh -c "alembic upgrade head && python -m app.main_bot"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations

  api:
    build: .
    restart: unless-stopped
    command: uvicorn app.main_api:app --host 0.0.0.0 --port 8000
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app

volumes:
  pgdata:
