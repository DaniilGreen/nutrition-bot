# Пуш в main → сервер подтягивает код и перезапускает стек.
#
# ponytail: без раннеров и registry — ssh + git pull + compose. Для двух пользователей
# полноценный пайплайн (build → push в registry → pull) лишний слой; потолок такой
# схемы — один сервер, появится второй → тогда registry.
name: deploy

on:
  push:
    branches: [main]
  pull_request:             # на PR гоняем ТОЛЬКО тесты — чтобы не мержить непроверенное
  workflow_dispatch:        # задеплоить руками, без пустого коммита

concurrency: deploy         # два пуша подряд не полезут на сервер одновременно

jobs:
  # Гейт: красные тесты → деплоя не будет. Без него авто-деплой катит в прод вслепую и
  # кладёт живого бота (раньше ловилось глазами при ручном рестарте, теперь ловить некому).
  # БД и LLM не нужны — всё на in-memory фейках, прогон ~3 сек.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      # Сборки фронта нет и не будет (§5.7, MA-INV-14) — но файл должен существовать.
      # Без него StaticFiles не смонтируется, аппка отдаст 404 на корень, а бот при этом
      # будет жив: деплой прошёл бы «зелёным» с мёртвой аппкой.
      - name: web присутствует
        run: test -f web/index.html

  deploy:
    needs: test
    if: github.event_name != 'pull_request'   # PR только проверяем, катит только main
    runs-on: ubuntu-latest
    steps:
      - name: ssh deploy
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o BatchMode=yes root@"$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/burnfat
          git fetch --quiet origin main
          git reset --hard --quiet origin/main   # деплой = точная копия main
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
          docker image prune -f >/dev/null       # 10 ГБ диска: старые слои иначе забьют его
          REMOTE

      - name: verify
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          sleep 20   # миграции + выход бота на polling
          ssh -o BatchMode=yes root@"$SSH_HOST" '
            cd /opt/burnfat
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
            docker compose logs --since 90s bot | grep -q "Run polling"
          '

      - name: verify miniapp
        env:
          MINIAPP_URL: https://nutrition-calorie.greenjola.win
        run: |
          set -euo pipefail
          # Запрос снаружи, с раннера, а не с сервера: одним вызовом накрывает всю
          # цепочку DNS → TLS → Caddy соседа → сеть edge → uvicorn. Сертификат
          # проверяется по умолчанию, поэтому протухший или невыпущенный валит шаг.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$MINIAPP_URL/health")
          test "$code" = "200" || { echo "health вернул $code"; exit 1; }
          # Корень обязан отдать HTML, а не 404: значит статика смонтирована.
          type=$(curl -sS -o /dev/null -w '%{content_type}' --max-time 20 "$MINIAPP_URL/")
          case "$type" in text/html*) ;; *) echo "корень отдал $type"; exit 1 ;; esac
          # Без подписи — только 401. Открытый /api/me означал бы дыру в MA-INV-6.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$MINIAPP_URL/api/me")
          test "$code" = "401" || { echo "api/me без подписи вернул $code"; exit 1; }
          echo "аппка отвечает: health 200, корень HTML, api под замком"
