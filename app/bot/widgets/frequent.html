<style>
:root{color-scheme:light dark;--t:light-dark(#0e1013,#fff);--m:light-dark(#4e5560,#a7abb2);--b1:light-dark(#f7f9fc,#22262c);--b2:light-dark(#e2e8f0,#131518);--cd:light-dark(rgba(255,255,255,.72),rgba(255,255,255,.055));--tr:light-dark(#d3dae3,#32363d);--ac:light-dark(#2d6a93,#5e9ac1);--at:light-dark(#fff,#0e1013);--ok:light-dark(#1d7a3a,#34c759)}
body{margin:0;padding:12px 14px max(26px,env(safe-area-inset-bottom));font:15px/1.3 "Segoe UI",system-ui,sans-serif;color:var(--t);background:{{sheen}}linear-gradient(165deg,var(--b1),var(--b2));font-variant-numeric:tabular-nums}
header{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}header b{font-size:20px}.m{color:var(--m);font-size:13px}
#g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tl{background:var(--cd);border-radius:16px;padding:10px 12px;min-height:58px;cursor:pointer;transition:transform .15s}
.tl:active{transform:scale(.97)}.tl b{display:block;font-size:15px;font-weight:600;max-height:2.6em;overflow:hidden;overflow-wrap:anywhere;hyphens:auto}
.tl span{display:block;margin-top:4px;color:var(--m);font-size:13px}.tl.bz b{color:var(--m)}.tl.ok{animation:ok 1.5s}@keyframes ok{0%,70%{box-shadow:inset 0 0 0 2px var(--ok)}}
#ts{margin-top:10px;background:var(--cd);border-radius:16px;padding:10px 12px;display:flex;visibility:hidden;align-items:center;gap:10px;font-size:14px}
#ts span{flex:1}#ts button{border:0;border-radius:12px;padding:8px 12px;background:var(--ac);color:var(--at);font:600 14px "Segoe UI",system-ui,sans-serif}
#ts button[disabled]{background:var(--tr);color:var(--m)}
@media (prefers-reduced-motion:reduce){.tl{transition:none}.tl.ok{animation:none;box-shadow:inset 0 0 0 2px var(--ok)}}
@media (max-width:260px){#g{grid-template-columns:minmax(0,1fr);gap:6px}.tl{padding:8px 10px;min-height:0}.tl b{white-space:nowrap;text-overflow:ellipsis}header .m{display:none}}
.an .tl{animation:fu .45s ease-out both}@keyframes fu{from{opacity:0;transform:translateY(6px)}}@media (prefers-reduced-motion:reduce){.an *{animation:none!important}}@media (max-width:260px){#ts{display:none}}</style>
<header><b>{{ic:bolt}} Частое</b><span class=m>тап — запишу сразу</span></header>
<div id=g lang=ru></div><div id=ts><span id=tx></span><button id=ub>{{ic:back}} Вернуть</button></div>
<script>
{{boot}}const W=TW,$=i=>document.getElementById(i),J=s=>{try{return JSON.parse(s)}catch(e){return null}},
T=s=>(s+'').replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
let D=null,B=0,U=null;
const K=()=>Math.random().toString(36).slice(2,8).padEnd(6,'0'),hp=t=>{try{W.HapticFeedback.notificationOccurred(t)}catch(e){}},
L=l=>l<0?'перебор '+-l:'осталось '+l,
ERR={BUSY:'Ещё пишу предыдущее…',RATE_LIMITED:'Слишком часто — секунду.',TIMEOUT:'Бот не ответил — проверь в «Сегодня».',NOT_ALLOWED:'Открой чат с ботом, чтобы записать.'};
function draw(){AN();D=J(W&&W.chatData);const t=D&&D.t||[];$('g').innerHTML=t.length?t.map((x,i)=>'<div class=tl data-i='+i+' style="animation-delay:'+i*40+'ms"><b>'+(x[2][0]=='s'?'{{ic:pin}} ':'')+T(x[0])+'</b><span>'+(x[2][0]=='s'?'':T(x[1]).replace(' ','\u00a0')+' · ')+(x[4]?'≈':'')+x[3]+'\u00a0ккал</span></div>').join(''):'<p class=m>Пока нечего показать — запиши пару раз одно и то же.</p>'}
function toast(s,u){$('ts').style.cssText='visibility:visible;display:flex';$('tx').innerHTML=s;$('ub').style.display=u?'':'none';$('ub').disabled=false}
function idle(el){B=0;el.classList.remove('bz');const b=el.querySelector('b');b.innerHTML=b.dataset.n}
document.addEventListener('click',ev=>{document.body.classList.remove('an');const el=ev.target.closest('.tl');
if(el&&W&&!B){const x=D.t[+el.dataset.i],b=el.querySelector('b');B=1;document.querySelectorAll('.ok').forEach(t=>t.classList.remove('ok'));el.classList.add('bz');b.dataset.n=b.innerHTML;b.textContent='Пишу…';
let pr;try{pr=W.request('w:'+x[2]+':'+K())}catch(e){idle(el);return}pr.then(a=>{const r=J(a&&a.result)||{};idle(el);
if(r.ok){U=r.m;el.classList.add('ok');hp('success');toast('{{ic:ok}} Записал: <b>'+T(r.n)+'</b> · '+r.k+'\u00a0ккал · '+L(r.l),1)}
else{hp('error');toast(r.err=='gone'?'Этой плитки уже нет — открой «Частое» заново.':r.err=='busy'?'Ещё пишу — проверь в «Сегодня».':'Не записал — попробуй ещё раз.',0)}},
e=>{idle(el);hp('error');toast(ERR[e&&e.code]||'Не записал — попробуй ещё раз.',0)})}
else if(ev.target.id=='ub'&&U&&W&&!B){B=1;$('ub').disabled=true;$('ub').textContent='Возвращаю…';
let pr;try{pr=W.request('u:'+U+':'+K())}catch(e){B=0;$('ub').disabled=false;$('ub').innerHTML='{{ic:back}} Вернуть';return}pr.then(a=>{const r=J(a&&a.result)||{};B=0;$('ub').innerHTML='{{ic:back}} Вернуть';if(r.ok){U=null;hp('success');toast('Вернул — записи нет · '+L(r.l),0)}else toast(r.err=='edited'?'Запись уже поправили — удали её в «Сегодня».':r.err=='gone'?(U=null,'Этой записи уже нет — возвращать нечего.'):'Вернуть уже нельзя — удали в «Сегодня».',0)},
e=>{B=0;$('ub').innerHTML='{{ic:back}} Вернуть';toast(ERR[e&&e.code]||'Не вернул — попробуй ещё раз.',1)})}});
if(W){W.onEvent('chatDataChanged',draw);draw();try{W.ready&&W.ready()}catch(e){}}else draw();
</script>
