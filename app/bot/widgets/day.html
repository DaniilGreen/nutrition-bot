<style>

.nv{width:36px;height:32px;padding:0;font-size:18px}
.c{background:var(--cd);border-radius:18px;padding:4px 12px;margin-bottom:8px}
.gh{font-size:13px;font-weight:600;padding:8px 0 2px;color:var(--m)}

.tk{grid-column:1/-1;height:4px;border-radius:2px;background:var(--tr);overflow:hidden;margin-top:2px}.tk i{display:block;height:100%}
#ac{display:flex;gap:8px}#ac button{flex:1 1 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:8px 6px}.un{color:var(--al)}.bk{background:var(--ac);color:var(--at)}

.an .tk i{animation:g .9s ease-out}@keyframes g{from{width:0}}.an .e{animation:fu .4s ease-out both}@keyframes fu{from{transform:translateY(5px)}}@media (prefers-reduced-motion:reduce){.an *{animation:none!important}}</style>
