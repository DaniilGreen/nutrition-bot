<style>
:root{color-scheme:light dark;--t:light-dark(#0e1013,#fff);--m:light-dark(#4e5560,#a7abb2);--b1:light-dark(#f7f9fc,#22262c);--b2:light-dark(#e2e8f0,#131518);--cd:light-dark(#ffffffb8,#ffffff0e);--tr:light-dark(#d3dae3,#32363d);--br:light-dark(#5f6b7b,#7c8899);--fa:light-dark(#b25500,#ff9f45);--ac:light-dark(#2d6a93,#5e9ac1);--wa:light-dark(#835600,#ffd426);--ok:light-dark(#1d7a3a,#34c759)}
body{margin:0;padding:12px 14px max(12px,env(safe-area-inset-bottom));font:15px/1.3 system-ui,sans-serif;overflow-wrap:anywhere;color:var(--t);background:linear-gradient(165deg,var(--b1),var(--b2));font-variant-numeric:tabular-nums}
.m{color:var(--m);font-size:13px}header b{font-size:20px}
.bg{font-size:clamp(30px,12vw,44px);font-weight:700;letter-spacing:-1px;margin:6px 0 2px}.bg small{white-space:nowrap;font-size:15px;color:var(--m);font-weight:500;margin-left:4px}
.c{background:var(--cd);border-radius:18px;padding:10px 12px;margin-top:10px}
.rw{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;font-size:13px;margin:6px 0}.rw b{font-weight:600}
.tk{grid-column:1/-1;height:8px;border-radius:4px;background:var(--tr);overflow:hidden}.tk i{display:block;height:100%}
.pp{font-weight:600;color:var(--ok)}
.cu{counter-reset:n var(--n)}.cu::after{content:counter(n)}.an .cu{animation:cu 1s ease-out}@keyframes cu{from{--n:0}}.an .tk i{animation:g .9s ease-out}@keyframes g{from{width:0}}@media (prefers-reduced-motion:reduce){.an *{animation:none!important}}</style>
<header><b>🔥 Реальный расход</b></header>
<div id=bd></div>
<script>
let A1=1,CU=0;try{CSS.registerProperty({name:'--n',syntax:'<integer>',inherits:!1,initialValue:'0'});CU=1}catch(e){}const NU=v=>CU?'<span class=cu style="--n:'+v+'"></span>':v,AN=()=>{document.body.className=A1?'an':'';A1=0};
const W=window.TelegramWidget,$=i=>document.getElementById(i),J=s=>{try{return JSON.parse(s)}catch(e){return null}},
T=s=>(s+'').replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
let D=null;
function draw(){D=J(W&&W.chatData);if(!D||D.v!=1)return;AN();const d=D,h=[];
if(d.st=='ok'){h.push('<div class=m>по дневнику и замерам InBody</div><div class=bg>'+NU(d.t)+'<small>± '+d.er+' ккал/день</small></div>');
const rows=[['По формуле',d.fb,'--br'],['По замерам',d.t,'--ac'],['Ешь в среднем',d.in,'--fa']].filter(r=>r[1]),mx=Math.max(...rows.map(r=>r[1]))||1;
h.push('<div class=c>'+rows.map(r=>'<div class=rw><span>'+r[0]+'</span><b>'+r[1]+'</b><div class=tk><i style="width:'+Math.max(0,Math.min(100,r[1]/mx*100))+'%;background:var('+r[2]+')"></i></div></div>').join('')+
'<div class=m>полных дней '+d.ld+' из '+d.dd+'</div></div>');
if(d.pp)h.push('<div class=c><span class=pp>Цель по расходу: '+d.pp+' ккал</span><div class=m>Применить — в «Итогах» приложения ↓</div></div>')}
else{if(d.fb)h.push('<div class=m>по формуле (обмен × активность)</div><div class=bg>'+NU(d.fb)+'<small>ккал/день</small></div>')}
if(d.nt)h.push('<div class="c m">'+T(d.nt)+'</div>');
if(d.dt)h.push('<div class=c><b'+(d.da?' style="color:var(--wa)"':'')+'>'+T(d.dt)+'</b><div class=m style="margin-top:4px">'+T(d.dx)+'</div></div>');
$('bd').innerHTML=h.join('')}
if(W){W.onEvent('chatDataChanged',draw);draw();try{W.ready&&W.ready()}catch(e){}}else draw();
if(!D)document.body.insertAdjacentHTML('beforeend','<p class=m>Нет данных.</p>');
</script>
