<style>
:root{color-scheme:light dark;--t:light-dark(#0e1013,#fff);--m:light-dark(#4e5560,#a7abb2);--b1:light-dark(#f7f9fc,#22262c);--b2:light-dark(#e2e8f0,#131518);--cd:light-dark(#ffffffb8,#ffffff0e);--tr:light-dark(#d3dae3,#32363d);--br:light-dark(#5f6b7b,#7c8899);--pr:light-dark(#0b7d91,#3ac8e0);--fa:light-dark(#b25500,#ff9f45);--ca:light-dark(#6650d6,#9a87f4);--wa:light-dark(#835600,#ffd426);--dg:light-dark(#c4281c,#ff453a);--li:light-dark(#79808a,#8c9095);--da:light-dark(#1d2833,#c3cbd5);--ac:light-dark(#2d6a93,#5e9ac1);--at:light-dark(#fff,#0e1013)}

#hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.bg{font-size:clamp(24px,12vw,44px);font-weight:700;letter-spacing:-1px;line-height:1.05;margin-top:2px}.bg small{font-size:14px;color:var(--m);font-weight:500;margin-left:2px}
.tk{height:6px;border-radius:3px;background:var(--tr);margin-top:8px;overflow:hidden}.tk i{display:block;height:100%}.an .tk i{animation:g .8s ease-out}@keyframes g{from{width:0}}
.ft{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:12px;padding-top:10px;border-top:1px solid var(--tr);font-size:15px;gap:6px}
.ft b{font-weight:600}.ft s{text-decoration:none;color:var(--m);font-size:13px}.ft div:last-child{text-align:right}.d{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}
svg{display:block;width:100%;height:auto;margin-top:6px}.ax{display:flex;justify-content:space-between;font-size:11px;color:var(--m)}
#hs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ch{min-width:40px;padding:5px 6px;border-radius:12px;background:var(--cd);text-align:center;font-size:11px;color:var(--m);cursor:pointer}.ch b{display:block;font-size:13px;color:var(--t)}
.ch.on{background:var(--ac);color:var(--at)}.ch.on b{color:var(--at)}
.it{display:flex;gap:8px;cursor:pointer;font-size:14px;padding:3px 0;border-top:1px solid var(--tr)}.it:first-child{border:0}.it span:nth-child(2){flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ls{display:grid;grid-template-columns:minmax(0,1fr)}#ls>div{grid-area:1/1;visibility:hidden}#ls>.on{visibility:visible}.it small{display:block;color:var(--m);font-size:12px;overflow:hidden;text-overflow:ellipsis}
@media (max-width:260px){#dl,.pk,.ft s,.d{display:none}.ft{gap:4px}.ft .mi{font-size:11px}}@media (prefers-reduced-motion:reduce){.an *{animation:none}}
.an .dr{stroke-dasharray:1;animation:dr 1.2s ease-out}@keyframes dr{from{stroke-dashoffset:1}}</style>
<header class=r><b>Сегодня</b><span class=m id=dl></span><span class=sp></span><span class="p lv" id=lv></span><span class=p id=sk></span></header>
<section class=c id=hc><div id=hero></div><div class=ft id=ft></div></section>
<section class=c id=pc></section>
<div id=hs></div><div id=ls></div>
<script>
let A1=1;const TW=window.TelegramWidget;try{TW.setResizeAnchor('bottom')}catch(e){}const NU=v=>'<span class=cu data-n='+v+'>'+v+'</span>',AN=()=>{const v=!TW||TW.isActive!==!1;document.body.className=A1&&v?'an':'';if(A1&&v){A1=0;try{requestAnimationFrame(t0=>{const e=document.querySelectorAll('.cu'),f=t=>{const k=Math.min(1,(t-t0)/900);e.forEach(x=>x.textContent=Math.round(x.dataset.n*(1-(1-k)**3)));k<1&&requestAnimationFrame(f)};f(t0)})}catch(e){}}};try{TW.onEvent('activated',()=>{A1&&(window.RD||draw)()})}catch(e){}
const W=TW,$=i=>document.getElementById(i);
let D=null,E=0,S=-1,K='',ST=0,B=0;
const J=s=>{try{return JSON.parse(s)}catch(e){return null}},R=Math.round,C=n=>(n+'').replace('.',','),H=i=>('0'+(D.sh+i)%24).slice(-2),
T=s=>(s+'').replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';'),
bar=(v,g,c)=>'<div class=tk><i style="width:'+(g>0?Math.max(0,Math.min(100,v/g*100)):0)+'%;background:var('+c+')"></i></div>',
col=(l,n,u,c,sub,b)=>'<div><div class=m>'+l+'</div><div class=bg style="color:var('+c+')">'+NU(n)+(u?'<small>'+u+'</small>':'')+'</div>'+b+'<div class=mi>'+sub+'</div></div>',
ft=(l,c,v,g)=>'<div><div class=mi>'+(c?'<i class=d style="background:var('+c+')"></i>':'')+l+'</div><b>'+v+'</b>'+(g?'<s>/'+g+'</s>':'')+'</div>';
function hero(){const g=D.g,e=D.e,lk=D.l[0],lp=D.l[1],pk=D.pk!=null?'<span class=pk> · '+C(D.pk)+'\u00a0г/кг</span>':'';
$('hero').innerHTML=E?col('Съедено ккал',e[0],'','--t','из '+g[0]+(lk>=0?' · ещё '+lk:' · перебор '+-lk),bar(e[0],g[0],'--br'))+col('Съедено белка',e[1],'г','--t','из '+g[1]+pk,bar(e[1],g[1],'--pr')):col(lk<0?'Перебор ккал':'Осталось ккал',Math.abs(lk),'',lk<0?'--dg':'--t',e[0]+' из '+g[0],bar(e[0],g[0],'--br'))+col('Осталось белка',Math.max(0,lp),'г',lp>0&&e[0]>0?'--wa':'--t',e[1]+' из '+g[1]+pk,bar(e[1],g[1],'--pr'));
$('ft').innerHTML=ft('Жир','--fa',e[2],g[2])+ft('Углев.','--ca',e[3],g[3])+ft('Оценка','',e[0]?'≈'+D.es+'%':'—')}
function pace(){const n=D.n,p=$('pc');p.style.display=n&&D.g[0]?'':'none';if(!n||!D.g[0])return;const hn=D.hn,cum=[],h={};let a=0;(D.h||[]).forEach(x=>h[x[0]]=x[1]);for(let i=0;i<=hn;i++){a+=h[i]||0;cum.push(a)}
const mx=Math.max(D.g[0],n[23],a)*1.05,X=i=>i*300/23,Y=v=>(53-v/mx*49).toFixed(1),pl=v=>v.map((y,i)=>X(i).toFixed(1)+','+Y(y)).join(' '),b=v=>'<b style="color:var(--t)">'+R(v)+'</b>',L=(v,c,w,d)=>'<polyline points="'+pl(v)+'" fill=none stroke="var('+c+')" stroke-width='+w+(d?' stroke-dasharray="5 4"':' stroke-linejoin=round stroke-linecap=round pathLength=1 class=dr')+' />';
p.innerHTML='<div class=m>К '+H(hn+1)+':00 обычно ┄ '+b(n[hn])+' · сейчас ━ '+b(D.nk!=null?D.nk:a)+'</div><svg viewBox="0 0 300 56"><line x1=0 x2=300 y1='+Y(D.g[0])+' y2='+Y(D.g[0])+' stroke="var(--tr)" stroke-dasharray="2 4"/>'+L(n,'--li',2,1)+L(cum,'--da',3)+'<circle cx='+X(hn)+' cy='+Y(a)+' r=4.5 fill="var(--da)"/></svg><div class=ax>'+[0,6,12,18,23].map(i=>'<span>'+H(i)+'</span>').join('')+'</div>'}
function hours(){const al=D.h||[],k0=Math.max(3,Math.floor(((document.body.clientWidth||320)-22)/58)),k=al.length>k0?k0-1:k0,hs=al.slice(-k);if(!hs.some(x=>x[0]==S))S=hs.length?hs[hs.length-1][0]:-1;
$('hs').innerHTML=hs.length?(al.length>k?'<span class=m>+'+(al.length-k)+'\u00a0ч</span>':'')+hs.map(x=>'<div class="ch'+(x[0]==S?' on':'')+'" data-h='+x[0]+'>'+H(x[0])+'<b>'+x[1]+'</b></div>').join(''):'<div class=m>Пока пусто — напиши, что съел.</div>';
$('ls').innerHTML=hs.map(h=>{const all=(D.it||[]).filter(x=>x[0]==h[0]),its=all.slice(0,4),mo=(h[2]||all.length)-its.length;
return'<div'+(h[0]==S?' class=on':'')+'>'+its.map(x=>'<div class=it data-m='+x[9]+'><span class=m>'+H(x[0])+':'+x[1]+'</span><span>'+T(x[2])+(x[5]!=null?'<small>'+(x[5]?x[5]+'\u00a0г · ':'')+'Б'+x[6]+' Ж'+x[7]+' У'+x[8]+'</small>':'')+'</span><b>'+(x[4]?'≈':'')+x[3]+'</b></div>').join('')+(mo>0?'<div class="it m">Ещё '+mo+' — в приложении ↓</div>':'')+'</div>'}).join('')}
function draw(s=W&&W.chatData){const d=J(s);if(!d||d.v!=1)return;const k=JSON.stringify({...d,at:0,hn:0}),sm=K==k;K=k;D=d;
$('dl').textContent=d.dl;$('lv').innerHTML=ST?(ST>1?'снимок':'итог дня'):'<i></i>'+d.at;const k2=d.s;$('sk').style.display=k2?'':'none';$('sk').textContent=k2?(k2[0]?'🔥 '+k2[0]+(k2[1]?' ❄':'')+' · ':'')+k2[2]+' из '+k2[3]:'';
if(sm&&!A1)return;AN();hero();pace();hours();
}
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-h]');if(t){S=+t.dataset.h;hours();hp()}else if(ev.target.closest('#hero')){E=1-E;hero();hp()}else{const m=ev.target.closest('[data-m]');if(m&&m.dataset.m>0&&W.request)try{W.request('o:'+m.dataset.m+':'+(Date.now()%1e6+1e6)).then(hp,hp)}catch(e){}}});

function ask(){if(!W||!D||!W.request||ST||B)return;B=1;try{W.request('t:'+D.d).then(a=>{B=0;const r=J(a&&a.result);if(r&&r.st){ST=r.st;draw(W.chatData)}else if(r&&r.v)draw(a.result)},()=>B=0)}catch(e){B=0}}
if(W){W.onEvent('chatDataChanged',()=>draw(W.chatData));W.onEvent('activated',ask);draw(W.chatData);try{W.ready&&W.ready()}catch(e){}ask()}
if(!D)document.body.insertAdjacentHTML('beforeend','<p class=m>Нет данных.</p>');
</script>
