<style>#hero{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}#hero svg{width:88px;height:88px;flex:none;transform:rotate(-90deg)}.rw{flex:1 1 130px;min-width:0}.rw div{display:flex;gap:4px;align-items:baseline;padding:2px 0;font-size:13px}.rw span{flex:1;color:var(--m)}.rw s{text-decoration:none;color:var(--m);font-size:12px}.rw i{font-style:normal;font-weight:600}.ft:empty{display:none}.an .ar{animation:ar .9s ease-out both}@keyframes ar{from{stroke-dasharray:0 400}}@media (max-width:260px){.rw div{font-size:12px}.rw i{display:none}}</style>
