<style>

.an .it{animation:fu .4s ease-out both}@keyframes fu{from{transform:translateY(6px)}}@media (prefers-reduced-motion:reduce){.an *{animation:none!important}}</style>

<script>

(s?s.map((g,j)=>'<button class="sz'+(G[i]==g?' on':'')+'" data-g='+g+'>'+'SML'[j]+(nw?'·'+g:' · '+g+' г')+'</button>').join(''):'')+
(x[6]==0?'<span class=st'+(G[i]?'':' style="visibility:hidden"')+'><button data-s=-1>−</button><b>'+G[i]+' г</b><button data-s=1>+</button></span>':x[6]==1?'<span class=m>'+G[i]+' г · вес из названия</span>':x[6]==2?'<span class=m>свои цифры</span>':'')+'</div></div>'}).join('')+'</div>'+

document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b||!D||B)return;const row=b.closest('[data-i]'),i=row&&+row.dataset.i;
