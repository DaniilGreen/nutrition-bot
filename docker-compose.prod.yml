# Прод-оверрей поверх docker-compose.yml (сервер с публичным IP).
# Использовать: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Единственная задача — не светить порты наружу. В базовом compose они опубликованы
# на все интерфейсы (удобно на локальной машине за NAT), а на публичном IP это значит
# Postgres с дефолтным паролем и открытый API в интернете. Биндим на localhost:
# доступ остаётся с самого сервера и через SSH-туннель, снаружи — закрыто.
services:
  db:
    ports: !reset []      # наружу не публикуем вовсе: бот ходит к db внутри compose-сети,
                          # а руками — docker compose exec db psql. Заодно нет гонки за порт.

  api:
    ports: !reset []      # наружу не публикуем: Caddy соседа ходит к нам внутри сети `edge`,
                          # хостовой порт не нужен и был бы открытым API в интернете.
    networks:
      # default — свой проект (db). edge — общая сеть с finance, там живёт Caddy,
      # который держит 80/443 и терминирует TLS для обоих доменов (§5.5).
      # Указав networks, теряем неявный default — поэтому он явно.
      default: {}
      edge:
        aliases:
          # Под этим именем нас зовёт Caddy. Не `api`: сервис с таким именем есть
          # и у соседа, короткое имя в общей сети дало бы гонку DNS.
          - burnfat-api

networks:
  # Создаётся руками один раз: docker network create edge
  # external — «не создавать и не удалять». Сети нет → compose up падает целиком,
  # вместе с ботом. Проверять до выкатки (§5.10).
  edge:
    external: true
